name: Trigger Jobright Scrape

on:
  schedule:
    - cron: '0 1,7,13,19 * * *'  # 4x daily at 1am, 7am, 1pm, 7pm UTC (offset from LinkedIn scraper)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape
        run: |
          curl -s -X POST "${{ secrets.HF_SPACE_URL }}/scrape/all" \
            -H "x-api-key: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
