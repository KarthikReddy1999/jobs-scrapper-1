name: Trigger Jobright Scrape

on:
  workflow_dispatch:  # manual trigger only — add schedule cron after HF Space is set up

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scrape
        run: |
          curl -s -X POST "${{ secrets.HF_SPACE_URL }}/scrape/all" \
            -H "x-api-key: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
